<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어타파</title>
  <style>
    :root { --ink:#18202b; --muted:#697586; --line:#e7eaf0; --blue:#3659e3; --soft:#f5f7ff; --bg:#fafbfc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .app { display:grid; grid-template-columns:272px 1fr; min-height:100vh; }
    aside { padding:28px 18px; background:#fff; border-right:1px solid var(--line); }
    .brand { display:flex; gap:10px; align-items:center; margin:0 10px 34px; font-weight:800; font-size:20px; letter-spacing:-.6px; }
    .logo { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; color:#fff; background:var(--blue); font-size:18px; }
    .side-heading { display:flex; justify-content:space-between; align-items:center; margin:0 10px 10px; font-size:12px; color:var(--muted); font-weight:700; }
    .add-book { display:grid; place-items:center; width:25px; height:25px; border-radius:7px; color:var(--blue); background:#eef1ff; font-size:20px; }
    #bookList { display:grid; gap:5px; }
    .book { display:flex; align-items:center; gap:9px; width:100%; padding:11px 10px; border-radius:9px; text-align:left; color:#424b5a; background:transparent; }
    .book:hover,.book.active { color:#243db1; background:var(--soft); font-weight:700; }
    .book-icon { font-size:17px; }
    main { width:min(1020px,100%); margin:0 auto; padding:46px 50px 72px; }
    .empty { display:grid; place-content:center; min-height:80vh; text-align:center; color:var(--muted); }
    .empty h1 { margin:0 0 10px; color:var(--ink); font-size:28px; }
    .empty p { margin:0 0 22px; }
    .primary { padding:11px 16px; border-radius:9px; color:#fff; background:var(--blue); font-weight:700; box-shadow:0 5px 12px #3659e32b; }
    .head-actions,.section-actions { display:flex; align-items:center; gap:8px; }
    .icon-action { display:grid; place-items:center; width:36px; height:36px; border-radius:9px; color:#697586; background:#f2f4f7; font-size:17px; }
    .icon-action:hover { color:#243db1; background:#e9edff; }
    .book-head { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:32px; }
    .eyebrow { margin:0 0 7px; color:var(--blue); font-size:13px; font-weight:800; }
    h1 { margin:0; font-size:31px; letter-spacing:-1.2px; }
    .sub { margin:9px 0 0; color:var(--muted); font-size:14px; }
    .sections { display:grid; gap:18px; }
    .section { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .section-top { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 16px; }
    .section-title { display:flex; gap:10px; align-items:center; font-weight:800; font-size:17px; }
    .count { padding:3px 8px; border-radius:999px; color:var(--muted); background:#f0f2f5; font-size:12px; font-weight:700; }
    .add-word { padding:7px 10px; border-radius:7px; color:var(--blue); background:#eff2ff; font-size:13px; font-weight:700; }
    .bulk-word { padding:7px 10px; border-radius:7px; color:#7043bb; background:#f3edff; font-size:13px; font-weight:700; }
    .words { border-top:1px solid var(--line); }
    .word { display:grid; grid-template-columns:1fr 1.2fr 34px 40px; gap:12px; align-items:center; min-height:55px; padding:12px 22px; border-bottom:1px solid #f0f1f4; }
    .word:last-child { border-bottom:0; }
    .term { font-weight:750; } .meaning { color:#596576; font-size:14px; }
    .delete { width:29px; height:29px; border-radius:7px; color:#a3abb7; background:transparent; font-size:18px; }
    .delete:hover { color:#dc415b; background:#fff0f2; }
    .favorite { width:29px; height:29px; border-radius:7px; color:#b6bfcc; background:transparent; font-size:17px; }.favorite:hover,.favorite.active { color:#e7a423; background:#fff7dc; }
    .no-words { padding:25px 22px; color:#98a1ae; font-size:14px; }
    .add-section { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; min-height:54px; border:1px dashed #aeb9d6; border-radius:12px; color:var(--blue); background:#fff; font-weight:700; }
    dialog { width:min(440px,calc(100% - 32px)); padding:0; border:0; border-radius:16px; box-shadow:0 20px 70px #19223b40; }
    dialog::backdrop { background:#15203a66; }
    .modal { padding:27px; } .modal h2 { margin:0 0 20px; font-size:21px; }
    label { display:grid; gap:7px; margin:0 0 15px; color:#4e5969; font-size:13px; font-weight:700; }
    input,textarea,select { width:100%; padding:11px 12px; border:1px solid #dbe0e8; border-radius:8px; outline:none; color:var(--ink); background:#fff; }
    input:focus,textarea:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #3659e31a; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }.secondary{padding:10px 14px;border-radius:8px;color:#596576;background:#f1f3f6;font-weight:700;}
    .bulk-help { margin:-4px 0 12px; color:#657286; font-size:13px; line-height:1.55; }.bulk-help code { padding:2px 5px; border-radius:4px; color:#5c37a5; background:#f3edff; }
    .bulk-text { min-height:180px; resize:vertical; line-height:1.6; }.bulk-status { min-height:18px; margin-top:9px; color:#c13d57; font-size:12px; }
    .study-mode { display:grid; gap:9px; }.mode-choice { padding:14px; border:1px solid #e1e5ee; border-radius:10px; color:#303b4d; background:#fff; text-align:left; }.mode-choice:hover { border-color:#8293ef; background:#f7f8ff; }.mode-choice b { display:block; margin-bottom:3px; }.mode-choice small { color:#748093; }
    .study-card { padding:32px 24px; border-radius:14px; color:#202a3d; background:#f7f8ff; text-align:center; }.study-label { margin:0 0 13px; color:#6875b4; font-size:12px; font-weight:800; }.study-question { margin:0; font-size:28px; font-weight:800; }.study-answer { display:none; margin:20px 0 0; padding-top:18px; border-top:1px solid #dfe5ff; color:#3d4a65; font-size:18px; line-height:1.7; }.study-answer.show { display:block; }.study-progress { margin:14px 0 0; color:#788496; font-size:13px; text-align:center; }
    .know { padding:10px 14px; border-radius:8px; color:#16724b; background:#e5f7ec; font-weight:800; }.unknown { padding:10px 14px; border-radius:8px; color:#be3e58; background:#ffedf0; font-weight:800; }
    .quiz-options,.match-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:16px; }.quiz-option,.match-card { min-height:54px; padding:10px; border:1px solid #e0e5ee; border-radius:9px; color:#303b4d; background:#fff; font-weight:700; }.quiz-option:hover,.match-card:hover { border-color:#7185e9; background:#f5f7ff; }.match-card.selected { border-color:#5e73dd; color:#3149be; background:#edf0ff; }.match-card.done { visibility:hidden; }.quiz-feedback { min-height:22px; margin-top:12px; color:#687586; font-size:13px; text-align:center; }
    .spell-input { margin-top:16px; font-size:18px; text-align:center; }.spell-input.correct { border-color:#2f9b67; background:#effbf4; }.spell-input.wrong { border-color:#e06a7f; background:#fff3f5; }
    @media (max-width:700px) { .app{grid-template-columns:1fr}.app aside{padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 4px 15px}.side-heading{margin:0 4px 7px}#bookList{display:flex;overflow:auto}.book{width:auto;white-space:nowrap}main{padding:32px 18px}.book-head{display:block}.book-head .primary{margin-top:18px}.word{grid-template-columns:1fr 1fr 30px;padding:12px 16px;gap:9px} }
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="brand"><span class="logo">A</span>영어타파</div><div class="side-heading">내 단어장 <button class="add-book" onclick="openBookModal()" aria-label="단어장 추가">+</button></div><div id="bookList"></div></aside>
    <main id="content"></main>
  </div>
  <dialog id="bookModal"><form class="modal" method="dialog" onsubmit="createBook(event)"><h2>새 단어장 만들기</h2><label>단어장 이름<input id="bookName" required placeholder="예: 토익 핵심 단어" /></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">만들기</button></div></form></dialog>
  <dialog id="sectionModal"><form class="modal" method="dialog" onsubmit="createSection(event)"><h2>새 섹션 만들기</h2><label>섹션 이름<input id="sectionName" required placeholder="예: Day 1 · 기본 어휘" /></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">추가</button></div></form></dialog>
  <dialog id="wordModal"><form class="modal" method="dialog" onsubmit="createWord(event)"><h2>단어 추가</h2><label>영어<input id="english" required placeholder="예: achieve" /></label><label>일본어<input id="japanese" required placeholder="예: 達成する" /></label><label>한국어<input id="korean" required placeholder="예: 성취하다" /></label><label>메모 <input id="note" placeholder="선택 사항" /></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">저장</button></div></form></dialog>
  <dialog id="bulkModal"><form class="modal" method="dialog" onsubmit="importBulkWords(event)"><h2>단어 한꺼번에 추가</h2><p class="bulk-help">ChatGPT가 정리한 내용을 <code>영어 | 일본어 | 한국어</code> 순서로 붙여넣으세요.</p><textarea id="bulkText" class="bulk-text" required placeholder="apple | りんご | 사과&#10;banana | バナナ | 바나나&#10;kiwi | キウイ | 키위"></textarea><div id="bulkStatus" class="bulk-status"></div><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">단어 추가</button></div></form></dialog>
  <dialog id="studyModeModal"><div class="modal"><h2>학습 방식 선택</h2><div class="study-mode"><button class="mode-choice" onclick="openDirectionFirst('study')"><b>🃏 반복 암기</b><small>알아요·잘 모르겠어요로 반복 학습</small></button><button class="mode-choice" onclick="openLanguageChoice('recall')"><b>🧠 리콜 테스트</b><small>정답을 보기 전에 직접 떠올리기</small></button><button class="mode-choice" onclick="openLanguageChoice('spelling')"><b>⌨️ 스펠링 테스트</b><small>한국어 뜻을 보고 철자를 직접 입력</small></button><button class="mode-choice" onclick="openLanguageChoice('matching')"><b>🧩 매칭 게임</b><small>뜻과 단어 카드를 빠르게 연결하기</small></button></div><div class="actions"><button class="secondary" onclick="studyModeModal.close()">취소</button></div></div></dialog>
  <dialog id="languageModal"><div class="modal"><h2 id="languageTitle">언어 선택</h2><div class="study-mode"><button class="mode-choice" onclick="chooseLanguage('english')"><b>영어</b><small>한국어 뜻 → 영어</small></button><button class="mode-choice" onclick="chooseLanguage('japanese')"><b>일본어</b><small>한국어 뜻 → 일본어</small></button><button class="mode-choice" onclick="chooseLanguage('both')"><b>영어와 일본어 함께</b><small>한국어 뜻 → 두 언어</small></button></div><div class="actions"><button class="secondary" onclick="languageModal.close()">뒤로</button></div></div></dialog>
  <dialog id="directionModal"><div class="modal"><h2>문제 방향 선택</h2><div class="study-mode"><button class="mode-choice" onclick="chooseDirection('meaning-to-word')"><b>뜻을 보고 단어 외우기</b><small>한국어 뜻 → 영어·일본어</small></button><button class="mode-choice" onclick="chooseDirection('word-to-meaning')"><b>단어를 보고 뜻 외우기</b><small>영어·일본어 → 한국어 뜻</small></button></div><div class="actions"><button class="secondary" onclick="directionModal.close()">뒤로</button></div></div></dialog>
  <dialog id="studyModal"><div class="modal"><h2 id="studyTitle">반복 암기</h2><div class="study-card"><p class="study-label">한국어 뜻</p><p id="studyQuestion" class="study-question"></p><div id="studyAnswer" class="study-answer"></div></div><p id="studyProgress" class="study-progress"></p><div class="actions"><button class="secondary" onclick="studyModal.close()">끝내기</button><button id="revealButton" class="primary" onclick="revealAnswer()">정답 보기</button><button id="unknownButton" class="unknown" onclick="rateCard(false)" hidden>잘 모르겠어요</button><button id="knowButton" class="know" onclick="rateCard(true)" hidden>알아요</button></div></div></dialog>
  <dialog id="recallModal"><div class="modal"><h2 id="recallTitle">리콜 테스트</h2><div class="study-card"><p class="study-label">한국어 뜻</p><p id="recallQuestion" class="study-question"></p></div><div id="quizOptions" class="quiz-options"></div><p id="quizFeedback" class="quiz-feedback"></p><div class="actions"><button class="secondary" onclick="recallModal.close()">끝내기</button><button id="recallNext" class="primary" onclick="nextRecall()" hidden>다음 문제</button></div></div></dialog>
  <dialog id="spellingModal"><div class="modal"><h2 id="spellingTitle">스펠링 테스트</h2><div class="study-card"><p class="study-label">한국어 뜻</p><p id="spellingQuestion" class="study-question"></p></div><input id="spellingInput" class="spell-input" autocomplete="off" placeholder="철자를 입력하세요" /><p id="spellingFeedback" class="quiz-feedback"></p><div class="actions"><button class="secondary" onclick="spellingModal.close()">끝내기</button><button id="spellingCheck" class="primary" onclick="checkSpelling()">확인</button><button id="spellingNext" class="primary" onclick="nextSpelling()" hidden>다음 문제</button></div></div></dialog>
  <dialog id="matchingModal"><div class="modal"><h2 id="matchingTitle">매칭 게임</h2><p class="study-progress">왼쪽 뜻을 누른 뒤 알맞은 단어를 골라 주세요.</p><div id="matchGrid" class="match-grid"></div><p id="matchFeedback" class="quiz-feedback"></p><div class="actions"><button class="secondary" onclick="matchingModal.close()">끝내기</button><button id="matchingAgain" class="primary" onclick="startMatching(data.game.mode)" hidden>다시 하기</button></div></div></dialog>
  <dialog id="editBookModal"><form class="modal" method="dialog" onsubmit="saveBookEdit(event)"><h2>단어장 관리</h2><label>단어장 이름<input id="editBookName" required /></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">저장</button></div></form></dialog>
  <dialog id="editSectionModal"><form class="modal" method="dialog" onsubmit="saveSectionEdit(event)"><h2>섹션 관리</h2><label>섹션 이름<input id="editSectionName" required /></label><label>속한 단어장<select id="sectionBook"></select></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary">저장</button></div></form></dialog>
 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const key='wordnote-data-v1';
    let data=JSON.parse(localStorage.getItem(key)||'null') || {books:[{id:Date.now(),name:'나의 첫 단어장',sections:[{id:Date.now()+1,name:'기본 단어',words:[{id:Date.now()+2,term:'welcome',meaning:'환영하다; 환영',note:''},{id:Date.now()+3,term:'practice',meaning:'연습하다; 연습',note:''}]}]}], selected:null, pendingSection:null};
    if(!data.selected) data.selected=data.books[0]?.id;
    const save=()=>localStorage.setItem(key,JSON.stringify(data));
    const selected=()=>data.books.find(b=>b.id===data.selected);
    function render(){ save(); const book=selected(),visible=s=>data.favoritesOnly?s.words.filter(w=>w.favorite):s.words; document.getElementById('bookList').innerHTML=data.books.map(b=>`<button class="book ${b.id===data.selected?'active':''}" onclick="selectBook(${b.id})"><span class="book-icon">📘</span>${escape(b.name)}</button>`).join(''); const root=document.getElementById('content'); if(!book){root.innerHTML=`<div class="empty"><div><h1>나만의 단어장을 시작해 보세요</h1><p>학습 주제별로 단어장을 만들고, 섹션마다 단어를 정리할 수 있어요.</p><button class="primary" onclick="openBookModal()">첫 단어장 만들기</button></div></div>`;return} root.innerHTML=`<div class="book-head"><div><p class="eyebrow">MY VOCABULARY</p><h1>${escape(book.name)}</h1><p class="sub">${book.sections.length}개 섹션 · ${data.favoritesOnly?'즐겨찾기 ':''}${book.sections.reduce((n,s)=>n+visible(s).length,0)}개 단어</p></div><div class="head-actions"><button class="icon-action" title="단어장 이름 수정" onclick="openBookEdit()">✎</button><button class="icon-action" title="단어장 삭제" onclick="deleteBook()">×</button><button class="secondary" onclick="toggleFavoriteFilter()">${data.favoritesOnly?'★ 전체 보기':'☆ 즐겨찾기만'}</button><button class="secondary" onclick="openStudyMode()">암기 시작</button><button class="primary" onclick="openSectionModal()">+ 새 섹션</button></div></div><div class="sections">${book.sections.map(s=>`<article class="section"><div class="section-top"><div class="section-title">${escape(s.name)} <span class="count">${visible(s).length}</span></div><div class="section-actions"><button class="icon-action" title="섹션 수정 또는 이동" onclick="openSectionEdit(${s.id})">✎</button><button class="icon-action" title="섹션 삭제" onclick="deleteSection(${s.id})">×</button><button class="bulk-word" onclick="openBulkModal(${s.id})">☷ 한꺼번에 추가</button><button class="add-word" onclick="openWordModal(${s.id})">+ 단어 추가</button></div></div><div class="words">${visible(s).length?visible(s).map(w=>`<div class="word"><div class="term">${escape(w.english||w.term)}</div><div class="meaning">${w.japanese?`${escape(w.japanese)} · `:''}${escape(w.korean||w.meaning)}${w.note?` <small>· ${escape(w.note)}</small>`:''}</div><button class="favorite ${w.favorite?'active':''}" title="어려운 단어 표시" onclick="toggleFavorite(${s.id},${w.id})">★</button><button class="delete" title="삭제" onclick="deleteWord(${s.id},${w.id})">×</button></div>`).join(''):`<div class="no-words">${data.favoritesOnly?'이 섹션에는 즐겨찾기한 단어가 없어요.':'아직 추가된 단어가 없어요. 첫 단어를 추가해 보세요.'}</div>`}</div></article>`).join('')}<button class="add-section" onclick="openSectionModal()">＋ 새 섹션 만들기</button></div>`; }
    const escape=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function selectBook(id){data.selected=id;render()} function openBookModal(){bookName.value='';bookModal.showModal();bookName.focus()} function openSectionModal(){sectionName.value='';sectionModal.showModal();sectionName.focus()} function openWordModal(id){data.pendingSection=id;english.value=japanese.value=korean.value=note.value='';wordModal.showModal();english.focus()} function openBulkModal(id){data.pendingSection=id;bulkText.value='';bulkStatus.textContent='';bulkModal.showModal();bulkText.focus()} function openStudyMode(){const count=selected().sections.reduce((n,s)=>n+s.words.length,0);if(!count){alert('먼저 단어를 추가해 주세요.');return}studyModeModal.showModal()}
    function openBookEdit(){data.editBook=data.selected;editBookName.value=selected().name;editBookModal.showModal();editBookName.focus()} function openSectionEdit(id){data.editSection=id;editSectionName.value=selected().sections.find(s=>s.id===id).name;sectionBook.innerHTML=data.books.map(b=>`<option value="${b.id}" ${b.id===data.selected?'selected':''}>${escape(b.name)}</option>`).join('');editSectionModal.showModal();editSectionName.focus()}
    function createBook(e){e.preventDefault();data.books.push({id:Date.now(),name:bookName.value.trim(),sections:[]});data.selected=data.books.at(-1).id;bookModal.close();render()} function createSection(e){e.preventDefault();selected().sections.push({id:Date.now(),name:sectionName.value.trim(),words:[]});sectionModal.close();render()} function createWord(e){e.preventDefault();const s=selected().sections.find(x=>x.id===data.pendingSection);s.words.push({id:Date.now(),english:english.value.trim(),japanese:japanese.value.trim(),korean:korean.value.trim(),note:note.value.trim()});wordModal.close();render()} function deleteWord(sid,wid){const s=selected().sections.find(x=>x.id===sid);s.words=s.words.filter(w=>w.id!==wid);render()} function toggleFavorite(sid,wid){const word=selected().sections.find(s=>s.id===sid).words.find(w=>w.id===wid);word.favorite=!word.favorite;render()} function toggleFavoriteFilter(){data.favoritesOnly=!data.favoritesOnly;render()}
    function saveBookEdit(e){e.preventDefault();const b=data.books.find(b=>b.id===data.editBook);b.name=editBookName.value.trim();editBookModal.close();render()} function deleteBook(){const b=selected();if(!confirm(`'${b.name}' 단어장과 안의 모든 섹션을 삭제할까요?`))return;data.books=data.books.filter(x=>x.id!==b.id);data.selected=data.books[0]?.id||null;render()} function deleteSection(id){const s=selected().sections.find(x=>x.id===id);if(!confirm(`'${s.name}' 섹션과 안의 단어를 삭제할까요?`))return;selected().sections=selected().sections.filter(x=>x.id!==id);render()} function saveSectionEdit(e){e.preventDefault();const from=selected(),s=from.sections.find(x=>x.id===data.editSection),targetId=Number(sectionBook.value);s.name=editSectionName.value.trim();if(targetId!==from.id){from.sections=from.sections.filter(x=>x.id!==s.id);data.books.find(b=>b.id===targetId).sections.push(s)}editSectionModal.close();render()}
    function cleanLine(line){return line.replace(/^[•·\-*\d.()\s]+/,'').replace(/\s{2,}/g,' ').trim()} function parseBulkWords(text){return text.split(/\n+/).map(cleanLine).filter(Boolean).map(line=>line.split(/[|｜]/).map(x=>x.trim())).filter(parts=>parts.length===3&&parts.every(Boolean)).map(([english,japanese,korean])=>({english,japanese,korean}))} function importBulkWords(e){e.preventDefault();const words=parseBulkWords(bulkText.value);if(!words.length){bulkStatus.textContent='영어 | 일본어 | 한국어 순서의 줄을 찾지 못했어요.';return}const section=selected().sections.find(s=>s.id===data.pendingSection);words.forEach((word,i)=>section.words.push({id:Date.now()+i,...word,note:''}));bulkModal.close();render()}
    function studyWords(mode='both'){return selected().sections.flatMap(s=>s.words).filter(w=>{const english=w.english||w.term,japanese=w.japanese,korean=w.korean||w.meaning;return (!data.favoritesOnly||w.favorite)&&korean&&(mode!=='english'||english)&&(mode!=='japanese'||japanese)})} function shuffle(list){return [...list].sort(()=>Math.random()-.5)} function wordValue(w,mode){const english=w.english||w.term,japanese=w.japanese||'—';return mode==='english'?english:mode==='japanese'?japanese:`${english} · ${japanese}`} function openLanguageChoice(type){data.learningType=type;studyModeModal.close();languageTitle.textContent=type==='study'?'반복 암기 언어 선택':type==='recall'?'리콜 테스트 언어 선택':'매칭 게임 언어 선택';languageModal.showModal()} function chooseLanguage(mode){languageModal.close();if(data.learningType==='study')startStudy(mode);if(data.learningType==='recall')startRecall(mode);if(data.learningType==='matching')startMatching(mode)}
    function startStudy(mode){const words=shuffle(studyWords(mode));if(!words.length){alert('선택한 언어가 들어 있는 단어가 없어요.');return}data.study={mode,queue:words,retry:[],round:1,total:words.length,known:0};studyModal.showModal();showCard()} function showCard(){const state=data.study,w=state.queue[0],korean=w.korean||w.meaning;studyTitle.textContent=`반복 암기 · ${state.round}회차`;studyQuestion.textContent=korean;studyAnswer.innerHTML=state.mode==='english'?`<b>영어</b><br>${escape(wordValue(w,'english'))}`:state.mode==='japanese'?`<b>일본어</b><br>${escape(wordValue(w,'japanese'))}`:`<b>영어</b> ${escape(wordValue(w,'english'))}<br><b>일본어</b> ${escape(wordValue(w,'japanese'))}`;studyAnswer.classList.remove('show');revealButton.hidden=false;knowButton.hidden=true;unknownButton.hidden=true;studyProgress.textContent=`남은 카드 ${state.queue.length}장 · 다시 볼 카드 ${state.retry.length}장`} function revealAnswer(){studyAnswer.classList.add('show');revealButton.hidden=true;knowButton.hidden=false;unknownButton.hidden=false} function rateCard(known){const state=data.study,card=state.queue.shift();if(known)state.known++;else state.retry.push(card);if(!state.queue.length){if(state.retry.length){state.queue=shuffle(state.retry);state.retry=[];state.round++}else{alert(`암기 완료! ${state.total}개 단어를 모두 기억했어요.`);studyModal.close();return}}showCard()}
    function startRecall(mode){const words=shuffle(studyWords(mode));if(!words.length){alert('선택한 언어가 들어 있는 단어가 없어요.');return}data.recall={mode,words,index:0,score:0};recallModal.showModal();showRecall()} function showRecall(){const state=data.recall,w=state.words[state.index],options=shuffle([w,...shuffle(state.words.filter(x=>x.id!==w.id)).slice(0,3)]);recallTitle.textContent=`리콜 테스트 · ${state.index+1}/${state.words.length}`;recallQuestion.textContent=w.korean||w.meaning;quizOptions.innerHTML=options.map(o=>`<button class="quiz-option" onclick="answerRecall(${o.id})">${escape(wordValue(o,state.mode))}</button>`).join('');quizFeedback.textContent='정답을 떠올린 뒤 하나를 골라 주세요.';recallNext.hidden=true} function answerRecall(id){const state=data.recall,correct=state.words[state.index].id===id;if(correct)state.score++;quizFeedback.textContent=correct?'정답이에요! 🎉':'아쉬워요. 정답을 확인하고 다음 문제로 넘어가요.';recallNext.hidden=false;[...quizOptions.children].forEach(b=>b.disabled=true)} function nextRecall(){const state=data.recall;state.index++;if(state.index>=state.words.length){alert(`테스트 완료! ${state.words.length}개 중 ${state.score}개 정답이에요.`);recallModal.close();return}showRecall()}
    function startMatching(mode){const pairs=shuffle(studyWords(mode)).slice(0,6);if(pairs.length<2){alert('매칭 게임에는 단어가 2개 이상 필요해요.');return}data.game={mode,pairs,selected:null,done:[]};matchingModal.showModal();renderMatching()} function renderMatching(){const game=data.game,questions=game.pairs.map(w=>`<button class="match-card ${game.selected===w.id?'selected':''} ${game.done.includes(w.id)?'done':''}" onclick="selectMatchQuestion(${w.id})">${escape(w.korean||w.meaning)}</button>`).join(''),answers=shuffle(game.pairs).map(w=>`<button class="match-card ${game.done.includes(w.id)?'done':''}" onclick="selectMatchAnswer(${w.id})">${escape(wordValue(w,game.mode))}</button>`).join('');matchingTitle.textContent=`매칭 게임 · ${game.done.length}/${game.pairs.length}`;matchGrid.innerHTML=questions+answers;matchFeedback.textContent=game.selected?'이제 알맞은 단어를 골라 주세요.':'뜻 카드 하나를 골라 주세요.';matchingAgain.hidden=true} function selectMatchQuestion(id){if(data.game.done.includes(id))return;data.game.selected=id;renderMatching()} function selectMatchAnswer(id){const game=data.game;if(!game.selected){matchFeedback.textContent='먼저 뜻 카드를 골라 주세요.';return}if(game.selected===id){game.done.push(id);game.selected=null;if(game.done.length===game.pairs.length){renderMatching();matchFeedback.textContent='전부 맞혔어요! 🎉';matchingAgain.hidden=false}else renderMatching()}else{game.selected=null;renderMatching();matchFeedback.textContent='다시 생각해 보고 골라 주세요.'}}
    function openLanguageChoice(type){data.learningType=type;data.directionFirst=false;studyModeModal.close();languageTitle.textContent=type==='study'?'반복 암기 언어 선택':type==='recall'?'리콜 테스트 언어 선택':type==='spelling'?'스펠링 테스트 언어 선택':'매칭 게임 언어 선택';languageModal.showModal()} function openDirectionFirst(type){data.learningType=type;data.directionFirst=true;studyModeModal.close();directionModal.showModal()} function chooseLanguage(mode){languageModal.close();data.pendingMode=mode;if(data.learningType==='matching')startMatching(mode);else if(data.learningType==='spelling')startSpelling(mode);else if(data.learningType==='study'&&data.pendingDirection)startStudy(mode,data.pendingDirection);else directionModal.showModal()} function chooseDirection(direction){directionModal.close();data.pendingDirection=direction;if(data.directionFirst){languageTitle.textContent='반복 암기 언어 선택';languageModal.showModal();return}if(data.learningType==='study')startStudy(data.pendingMode,direction);if(data.learningType==='recall')startRecall(data.pendingMode,direction)} function cardSides(w,mode,direction){const meaning=w.korean||w.meaning,word=wordValue(w,mode);return direction==='word-to-meaning'?{question:word,answer:meaning,label:'영어·일본어 단어'}:{question:meaning,answer:word,label:'한국어 뜻'}}
    function startStudy(mode,direction='meaning-to-word'){const words=shuffle(studyWords(mode));if(!words.length){alert('선택한 언어가 들어 있는 단어가 없어요.');return}data.study={mode,direction,queue:words,retry:[],round:1,total:words.length,known:0};studyModal.showModal();showCard()} function showCard(){const state=data.study,w=state.queue[0],sides=cardSides(w,state.mode,state.direction);studyTitle.textContent=`반복 암기 · ${state.round}회차`;studyQuestion.textContent=sides.question;document.querySelector('#studyModal .study-label').textContent=sides.label;studyAnswer.innerHTML=escape(sides.answer);studyAnswer.classList.remove('show');revealButton.hidden=false;knowButton.hidden=true;unknownButton.hidden=true;studyProgress.textContent=`남은 카드 ${state.queue.length}장 · 다시 볼 카드 ${state.retry.length}장`} function revealAnswer(){studyAnswer.classList.add('show');revealButton.hidden=true;knowButton.hidden=false;unknownButton.hidden=false} function rateCard(known){const state=data.study,card=state.queue.shift();if(known)state.known++;else state.retry.push(card);if(!state.queue.length){if(state.retry.length){state.queue=shuffle(state.retry);state.retry=[];state.round++}else{alert(`암기 완료! ${state.total}개 단어를 모두 기억했어요.`);studyModal.close();return}}showCard()}
    function startRecall(mode,direction='meaning-to-word'){const words=shuffle(studyWords(mode));if(!words.length){alert('선택한 언어가 들어 있는 단어가 없어요.');return}data.recall={mode,direction,words,index:0,score:0};recallModal.showModal();showRecall()} function showRecall(){const state=data.recall,w=state.words[state.index],options=shuffle([w,...shuffle(state.words.filter(x=>x.id!==w.id)).slice(0,3)]),sides=cardSides(w,state.mode,state.direction);recallTitle.textContent=`리콜 테스트 · ${state.index+1}/${state.words.length}`;recallQuestion.textContent=sides.question;document.querySelector('#recallModal .study-label').textContent=sides.label;quizOptions.innerHTML=options.map(o=>`<button class="quiz-option" onclick="answerRecall(${o.id})">${escape(cardSides(o,state.mode,state.direction).answer)}</button>`).join('');quizFeedback.textContent='정답을 떠올린 뒤 하나를 골라 주세요.';recallNext.hidden=true} function answerRecall(id){const state=data.recall,correct=state.words[state.index].id===id;if(correct)state.score++;quizFeedback.textContent=correct?'정답이에요! 🎉':'아쉬워요. 정답을 확인하고 다음 문제로 넘어가요.';recallNext.hidden=false;[...quizOptions.children].forEach(b=>b.disabled=true)} function nextRecall(){const state=data.recall;state.index++;if(state.index>=state.words.length){alert(`테스트 완료! ${state.words.length}개 중 ${state.score}개 정답이에요.`);recallModal.close();return}showRecall()}
    function startSpelling(mode){if(mode==='both'){alert('스펠링 테스트에서는 영어 또는 일본어를 골라 주세요.');return}const words=shuffle(studyWords(mode));if(!words.length){alert('선택한 언어가 들어 있는 단어가 없어요.');return}data.spelling={mode,words,index:0,score:0};spellingModal.showModal();showSpelling()} function showSpelling(){const state=data.spelling,w=state.words[state.index];spellingTitle.textContent=`스펠링 테스트 · ${state.index+1}/${state.words.length}`;spellingQuestion.textContent=w.korean||w.meaning;spellingInput.value='';spellingInput.className='spell-input';spellingInput.placeholder=state.mode==='english'?'영어 철자를 입력하세요':'일본어 단어를 입력하세요';spellingFeedback.textContent='한국어 뜻을 보고 철자를 직접 입력해 보세요.';spellingCheck.hidden=false;spellingNext.hidden=true;spellingInput.focus()} function checkSpelling(){const state=data.spelling,answer=wordValue(state.words[state.index],state.mode),guess=spellingInput.value.trim(),correct=guess.toLocaleLowerCase()===answer.toLocaleLowerCase();if(correct)state.score++;spellingInput.classList.add(correct?'correct':'wrong');spellingFeedback.textContent=correct?'정확해요! 🎉':`정답: ${answer}`;spellingCheck.hidden=true;spellingNext.hidden=false} function nextSpelling(){const state=data.spelling;state.index++;if(state.index>=state.words.length){alert(`스펠링 테스트 완료! ${state.words.length}개 중 ${state.score}개 정답이에요.`);spellingModal.close();return}showSpelling()} spellingInput?.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!spellingCheck.hidden)checkSpelling();else nextSpelling()}});
    render();
  </script>
